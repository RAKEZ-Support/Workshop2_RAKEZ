<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RAKEZ CX Workshop 2 Live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: RAKEZ navy hero + one overlapping card. Facilitator console = activity
   tabs, then a two-column body (brief/QR left, live results right) that stacks
   on narrow screens. Participant form = one scrolling page per activity with a
   sticky submit bar. Everything reflows from wide desktop down to ~360px. */
:root{
  --navy:#17203A; --navy-2:#1B2A44; --teal-deep:#005755; --teal:#01C1BC; --teal-2:#00A7A2; --gold:#DAA600; --gold-ink:#7A5E00;
  --ink:#1B2333; --muted:#5B6577; --soft:#8A94A6; --line:#E3E8EE; --line-2:#EEF2F5;
  --bg:#F3F6F9; --card:#FFFFFF; --tint:#E9F6F5; --tint-2:#F4FBFA; --gold-tint:#FFF6DC; --err:#B3261E; --err-bg:#FDECEA; --ok:#1E7A4F; --ok-bg:#E6F4EC;
  --seg-ni:#7030A0; --seg-ind:#00A99D; --seg-lta:#159FCC; --seg-sa:#0072A3;
  --lvl-low:#E7ECF0; --lvl-imp:#9ED9D5; --lvl-crit:#005755;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Plus Jakarta Sans',Calibri,'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --radius:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(23,32,58,.06),0 16px 40px rgba(23,32,58,.08);
  --gutter:clamp(16px,4vw,40px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.container{width:100%;max-width:1240px;margin:0 auto;padding-inline:var(--gutter)}
.container.narrow{max-width:1040px}
.ic{display:inline-flex;flex:none;width:22px;height:22px}
.ic svg{width:100%;height:100%;fill:currentColor}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:is(button,input,textarea,select):focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding-block:clamp(22px,3.5vw,34px) clamp(58px,6vw,72px);
  background:radial-gradient(1100px 320px at 85% -30%,rgba(1,193,188,.24),transparent 60%),linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 55%,var(--teal-deep) 140%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--teal) 0%,var(--teal-2) 45%,var(--gold) 100%)}
.herotop{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.logoplate{background:#fff;border-radius:13px;padding:8px 12px;line-height:0;box-shadow:0 8px 22px rgba(0,0,0,.18);flex:none}
.logoplate img{height:clamp(40px,5vw,50px);width:auto;display:block}
.herotop .div{width:1px;height:38px;background:rgba(255,255,255,.18)}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800;line-height:1.45;color:var(--teal)}
.hero h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,3vw,2.2rem);line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.hero .sub{margin:8px 0 0;color:#CFD8E6;max-width:70ch;font-size:clamp(.95rem,1.3vw,1.05rem)}
main{padding-bottom:56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.lift{margin-top:-46px;position:relative;z-index:2}
footer{text-align:center;color:var(--soft);font-size:.8rem;padding:0 var(--gutter) 36px}
footer::before{content:"";display:block;width:44px;height:3px;border-radius:3px;margin:0 auto 12px;background:linear-gradient(90deg,var(--teal),var(--gold))}

/* buttons, chips */
.btn{text-decoration:none;border:0;border-radius:var(--r-sm);padding:12px 22px;font-weight:800;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:.15s}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--teal-deep),var(--teal-2));box-shadow:0 8px 20px rgba(0,87,85,.22)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary[aria-disabled=true]{background:#A9BFC1;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--teal)}
.btn.sm{padding:8px 14px;font-size:.84rem}
.btn.danger{background:var(--err);color:#fff}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.88rem;cursor:pointer;transition:.15s;line-height:1.3;text-align:left}
.chip:hover:not(:disabled){border-color:var(--teal)}
.chip[aria-pressed=true],.chip[aria-checked=true]{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.k{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--teal-deep)}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem}
.notice{background:var(--gold-tint);color:var(--gold-ink);border-radius:var(--r-sm);padding:12px 14px;font-size:.88rem;font-weight:600}
.err{background:var(--err-bg);color:var(--err);border-radius:var(--r-sm);padding:12px 14px;font-size:.9rem}
.fielderr{color:var(--err);font-size:.84rem;font-weight:600;margin-top:8px}
.in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;font-size:.98rem;transition:.15s}
.in:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(1,193,188,.16)}
.in.bad{border-color:var(--err)}

/* segment badge */
.seg{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--sc,var(--ink))}
.seg .ic{width:22px;height:22px}
.segdot{width:10px;height:10px;border-radius:50%;background:var(--sc);display:inline-block}

/* ================= facilitator ================= */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;border-bottom:1px solid var(--line-2);background:var(--tint-2);border-radius:var(--radius) var(--radius) 0 0}
.tab{display:flex;align-items:center;gap:12px;text-align:left;border:0;background:transparent;border-radius:var(--r-sm);padding:12px 14px;cursor:pointer;min-width:0}
.tab .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#fff;color:var(--teal-deep);border:1.5px solid var(--line);flex:none}
.tab b{display:block;font-size:.95rem;line-height:1.25}
.tab small{display:block;color:var(--muted);font-size:.78rem;line-height:1.3}
.tab[aria-selected=true]{background:#fff;box-shadow:0 2px 10px rgba(23,32,58,.08)}
.tab[aria-selected=true] .num{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep)}
.console{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:clamp(18px,2.5vw,28px);padding:clamp(18px,2.5vw,28px)}
.side{display:grid;gap:16px;align-content:start}
.box{border:1px solid var(--line);border-radius:var(--r-sm);padding:16px}
.box h3{margin:0 0 6px;font-size:1rem}
.brief p{margin:6px 0 0;font-size:.9rem;color:var(--ink)}
.brief ol{margin:8px 0 0;padding-left:1.2em;font-size:.88rem}
.brief li{margin:4px 0}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#qrcode{padding:10px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;line-height:0;min-height:20px}
.linkrow{display:flex;gap:6px;width:100%}
.linkrow input{flex:1;min-width:0;font-size:.78rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted)}
.segstatus{display:grid;gap:8px}
.segstatus div{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.88rem;padding:8px 10px;border-radius:10px;background:var(--bg);min-width:0}
.segstatus div span:first-child{min-width:0;overflow-wrap:anywhere}
.pill{font-size:.72rem;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.wait{background:#fff;color:var(--soft);border:1px solid var(--line)}
.results{min-width:0}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rhead h2{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(1.25rem,2vw,1.5rem)}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
table.heat{border-collapse:separate;border-spacing:0;width:100%;min-width:620px;font-size:.86rem}
.heat th,.heat td{padding:10px 10px;border-bottom:1px solid var(--line-2);text-align:center;vertical-align:middle}
.heat th{background:var(--tint-2);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.heat th:first-child,.heat td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
.heat th:first-child{background:var(--tint-2)}
.heat tr:last-child td{border-bottom:0}
.stagecell{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.stagecell .ic{color:var(--teal-deep)}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px;padding:8px 6px;min-width:96px}
.cell.low{background:var(--lvl-low);color:var(--muted)}
.cell.imp{background:var(--lvl-imp);color:#0B3F3D}
.cell.crit{background:var(--lvl-crit);color:#fff}
.cell b{font-size:.8rem}
.cell small{font-size:.7rem;opacity:.9}
.cell .star{position:absolute;top:-7px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:.7rem;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.cell.none{background:transparent;color:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.78rem;color:var(--muted);font-weight:600;margin:12px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.segcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:16px}
.segcol{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;min-width:0;border-top:4px solid var(--sc)}
.segcol h4{margin:0 0 10px;font-size:.95rem}
.segcol .by{font-size:.76rem;color:var(--muted);margin:-6px 0 10px}
.mot{padding:10px 0;border-bottom:1px dashed var(--line)}
.mot:last-child{border-bottom:0;padding-bottom:0}
.mot .t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.92rem}
.mot .t .ic{color:var(--teal-deep);width:20px;height:20px}
.mot .why{font-size:.8rem;color:var(--muted);margin-top:3px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin-top:8px;font-size:.84rem}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.tagl{display:flex;flex-wrap:wrap;gap:5px}
.tagl span{background:var(--tint);color:var(--teal-deep);font-weight:700;font-size:.74rem;border-radius:999px;padding:3px 9px}
.quoteline{font-family:var(--display);color:var(--navy);font-size:.95rem;margin-top:6px;overflow-wrap:anywhere}
.ns-theme{margin-top:10px}
.ns-theme .th{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ns-theme .th .ic{width:18px;height:18px;color:var(--teal-deep)}
.nsrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-bottom:1px dashed var(--line-2);font-size:.86rem}
.nsrow:last-child{border-bottom:0}
.nsrow .tg{font-weight:800;color:var(--teal-deep);white-space:nowrap}
.nsrow .bs{grid-column:1/-1;font-size:.74rem;color:var(--muted)}
.confirmbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--err-bg);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px;font-size:.86rem;color:var(--err);font-weight:600}

/* ================= participant ================= */
.pcard{padding:0;overflow:visible}
.pintro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(16px,3vw,28px);padding:clamp(20px,3vw,34px);border-bottom:1px solid var(--line-2)}
.howto{background:var(--tint-2);border:1px solid #D5ECEA;border-radius:var(--r-sm);padding:16px 18px}
.howto ol{margin:8px 0 0;padding-left:1.2em;font-size:.92rem}
.howto li{margin:4px 0}
.who{display:grid;gap:14px;align-content:start}
label.fl{display:block;font-weight:700;margin-bottom:8px}
.req{color:var(--err);margin-left:3px}
.segpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.segbtn{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:12px;cursor:pointer;text-align:left;font-weight:700;font-size:.9rem;min-width:0;transition:.15s}
.segbtn .ic{width:26px;height:26px;color:var(--sc)}
.segbtn span{min-width:0;overflow-wrap:anywhere}
.segbtn:hover{border-color:var(--sc)}
.segbtn[aria-checked=true]{border-color:var(--sc);box-shadow:0 0 0 2px var(--sc);background:color-mix(in srgb,var(--sc) 7%,#fff)}
.psec{padding:clamp(20px,3vw,34px);border-bottom:1px solid var(--line-2)}
.psec:last-of-type{border-bottom:0}
.shead{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.shead .n{width:36px;height:36px;border-radius:50%;background:var(--teal-deep);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.shead h2{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(1.15rem,2vw,1.4rem);line-height:1.25;text-wrap:balance}
.shead p{margin:4px 0 0;color:var(--muted);font-size:.92rem;max-width:80ch}
.locked{padding:clamp(28px,4vw,48px);text-align:center;color:var(--muted)}

/* rating grid (activity 1) */
.rgrid{display:grid;gap:10px}
.rrow{display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:12px 18px;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
.rrow.done{border-color:#BFE3E0;background:var(--tint-2)}
.rhdr{display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:18px;padding:0 14px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.stg{display:flex;gap:12px;align-items:flex-start;min-width:0}
.stg .ic{width:30px;height:30px;color:var(--teal-deep);margin-top:2px}
.stg b{display:block;font-size:.98rem}
.stg small{display:block;color:var(--muted);font-size:.8rem;line-height:1.4}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg3 button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-weight:700;font-size:.82rem;cursor:pointer;transition:.15s;min-width:0;line-height:1.25}
.seg3 button:hover{border-color:var(--teal)}
.seg3 button[aria-checked=true][data-v=low]{background:#DCE3E8;border-color:#B9C4CC;color:var(--ink)}
.seg3 button[aria-checked=true][data-v=imp]{background:var(--lvl-imp);border-color:#6CC3BE;color:#0B3F3D}
.seg3 button[aria-checked=true][data-v=crit]{background:var(--lvl-crit);border-color:var(--lvl-crit);color:#fff}
.seg3 button[aria-checked=true][data-v=strong]{background:var(--ok-bg);border-color:#9BD0B3;color:var(--ok)}
.seg3 button[aria-checked=true][data-v=ok]{background:var(--gold-tint);border-color:#E9C866;color:var(--gold-ink)}
.seg3 button[aria-checked=true][data-v=weak]{background:var(--err-bg);border-color:#EBA59F;color:var(--err)}
.mlabel{display:none;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:6px}
.topgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.topbtn{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:12px 14px;cursor:pointer;transition:.15s;min-width:0}
.topbtn .r1{display:flex;align-items:center;gap:10px;width:100%;font-weight:800}
.topbtn .r1 .ic{color:var(--teal-deep);width:26px;height:26px}
.topbtn .r1 .box{margin-left:auto;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.topbtn small{font-size:.76rem;color:var(--muted)}
.topbtn .sugg{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold-tint);border-radius:999px;padding:2px 8px}
.topbtn[aria-pressed=true]{border-color:var(--teal-deep);box-shadow:0 0 0 2px var(--teal-deep);background:var(--tint-2)}
.topbtn[aria-pressed=true] .box{background:var(--teal-deep);border-color:var(--teal-deep)}
.topbtn[aria-pressed=true] .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.topbtn:disabled{opacity:.45;cursor:not-allowed}
.whycard{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;margin-top:12px}
.whycard h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:.98rem}
.whycard h3 .ic{color:var(--teal-deep)}

/* moment cards (activity 2) */
.momcard{border:1px solid var(--line);border-radius:var(--radius);margin-top:16px;overflow:hidden}
.momhead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--tint-2);border-bottom:1px solid var(--line-2)}
.momhead .ic{width:30px;height:30px;color:var(--teal-deep)}
.momhead h3{margin:0;font-size:1.05rem}
.momhead small{display:block;color:var(--muted);font-size:.8rem}
.momhead .st{margin-left:auto}
.momgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.q{padding:16px 18px;border-bottom:1px solid var(--line-2);min-width:0}
.q:nth-child(odd){border-right:1px solid var(--line-2)}
.q.full{grid-column:1/-1;border-right:0}
.q .ql{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;margin-bottom:4px}
.q .ql .ic{width:20px;height:20px;color:var(--teal-deep)}
.q .qh{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.opts{display:grid;gap:8px}
.optrow{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;font-size:.9rem;line-height:1.4;min-width:0;transition:.15s}
.optrow:hover{border-color:var(--teal)}
.optrow .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center}
.optrow[aria-checked=true]{border-color:var(--teal-deep);background:var(--tint-2)}
.optrow[aria-checked=true] .rd{border-color:var(--teal-deep);background:var(--teal-deep)}
.optrow[aria-checked=true] .rd::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.optrow .src{display:inline-block;margin-left:6px;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold-tint);border-radius:999px;padding:1px 7px;vertical-align:1px}
.optrow span.tx{min-width:0;overflow-wrap:anywhere}
.loaded{display:flex;gap:10px;align-items:center;background:var(--ok-bg);color:var(--ok);border-radius:var(--r-sm);padding:10px 14px;font-size:.88rem;font-weight:600;margin-bottom:14px}

/* north star (activity 3) */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.theme{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;min-width:0}
.theme .th{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.theme .th .ic{width:26px;height:26px;color:var(--teal-deep)}
.theme .th b{font-size:1rem}
.theme .th .cnt{margin-left:auto;font-size:.76rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.theme .th .cnt.full{color:var(--teal-deep)}
.theme .sub{font-size:.8rem;color:var(--muted);margin:0 0 10px}
.kpi{border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;transition:.15s;background:#fff}
.kpi.on{border-color:var(--teal-deep);box-shadow:0 0 0 2px rgba(0,87,85,.12)}
.kpi .kh{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.kpi .kh:disabled{cursor:not-allowed;opacity:.45}
.kpi .tick{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.kpi.on .tick{background:var(--teal-deep);border-color:var(--teal-deep)}
.kpi.on .tick::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.kpi .nm{font-weight:700;font-size:.86rem;min-width:0;overflow-wrap:anywhere}
.kpi .base{margin-left:auto;font-size:.7rem;font-weight:700;color:var(--teal-deep);background:var(--tint);border-radius:999px;padding:3px 8px;white-space:nowrap}
.kpi .tgt{padding:0 12px 12px 40px}
.kpi .tgt .in{padding:9px 11px;font-size:.88rem}
.kpi .rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.8rem;font-weight:700;padding:0;margin-top:6px;text-decoration:underline}
.addkpi{width:100%;border:1.5px dashed var(--line);background:none;color:var(--teal-deep);font-weight:700;font-size:.84rem;padding:10px;border-radius:10px;cursor:pointer}
.addkpi:hover{border-color:var(--teal);background:var(--tint-2)}

/* submit bar */
.subbar{position:sticky;bottom:0;z-index:5;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);padding:14px clamp(18px,3vw,34px) calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px}
.subbar .status{flex:1;min-width:0;font-size:.88rem;font-weight:600;color:var(--muted)}
.subbar .status.warn{color:var(--err)}
.thanks{text-align:center;padding:clamp(40px,7vw,72px) clamp(20px,5vw,60px)}
.thanks .big{width:84px;height:84px;border-radius:50%;background:var(--tint);color:var(--teal-deep);display:grid;place-items:center;margin:0 auto 18px}
.thanks .big .ic{width:44px;height:44px}
.thanks h2{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,3vw,2rem);margin:0 0 10px}
.thanks p{color:var(--muted);max-width:56ch;margin:0 auto 20px}

@media (max-width:1020px){
  .console{grid-template-columns:1fr}
  .side{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
  .themes{grid-template-columns:1fr}
}
@media (max-width:800px){
  .pintro{grid-template-columns:1fr}
  .rhdr{display:none}
  .rrow{grid-template-columns:1fr}
  .mlabel{display:block}
  .momgrid{grid-template-columns:1fr}
  .q:nth-child(odd){border-right:0}
}
@media (max-width:640px){
  body{font-size:15px}
  .herotop .div,.herotop .eyebrow{display:none}
  .tabs{grid-template-columns:1fr}
  .tab small{display:none}
  .segpick{grid-template-columns:1fr}
  .subbar{flex-wrap:wrap}
  .subbar .status{flex-basis:100%}
  .subbar .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- v2 additions: MoT table, dropdowns, analysis ---------- */
.whorow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:clamp(16px,3vw,28px);padding:clamp(20px,3vw,34px);border-bottom:1px solid var(--line-2);align-items:start}
.segpick4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mtwrap{border:1px solid var(--line);border-radius:var(--r-sm);overflow:visible}
table.mt{width:100%;border-collapse:separate;border-spacing:0;font-size:.88rem}
.mt thead th{position:sticky;top:0;z-index:3;background:var(--tint-2);text-align:left;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:12px 12px;border-bottom:1px solid var(--line)}
.mt thead th:first-child{border-top-left-radius:var(--r-sm)}
.mt thead th:last-child{border-top-right-radius:var(--r-sm)}
.mt thead th .h{display:flex;align-items:center;gap:6px}
.mt thead th .h .ic{width:16px;height:16px;color:var(--teal-deep)}
.mt td{padding:12px;vertical-align:top;border-bottom:1px solid var(--line-2);min-width:0}
.mt tr:last-child td{border-bottom:0}
.mt tr.crit td{background:linear-gradient(0deg,rgba(0,87,85,.035),rgba(0,87,85,.035))}
.mt tr.crit td:first-child{box-shadow:inset 4px 0 0 var(--teal-deep)}
.jcell{display:flex;gap:10px;align-items:flex-start;min-width:200px}
.jcell .ic{width:28px;height:28px;color:var(--teal-deep);margin-top:1px}
.jcell b{display:block;font-size:.95rem;line-height:1.3}
.jcell small{display:block;color:var(--muted);font-size:.76rem;line-height:1.35}
.crit3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:10px;min-width:220px}
.crit3 button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 4px;font-weight:700;font-size:.78rem;cursor:pointer;text-align:center;transition:.15s}
.crit3 button:hover{border-color:var(--teal)}
.crit3 button[aria-checked=true][data-v=low]{background:#DCE3E8;border-color:#B9C4CC}
.crit3 button[aria-checked=true][data-v=imp]{background:var(--lvl-imp);border-color:#6CC3BE;color:#0B3F3D}
.crit3 button[aria-checked=true][data-v=crit]{background:var(--lvl-crit);border-color:var(--lvl-crit);color:#fff}
.optnote{font-size:.74rem;color:var(--soft);font-weight:600;margin-top:4px}
.reqnote{font-size:.74rem;color:var(--teal-deep);font-weight:700;margin-top:4px}
/* dropdown (single or multi) */
.dd{position:relative;min-width:170px}
.dd>button.sum{width:100%;display:flex;align-items:flex-start;gap:8px;justify-content:space-between;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:.84rem;line-height:1.35;cursor:pointer;min-height:40px}
.dd>button.sum:hover{border-color:var(--teal)}
.dd>button.sum .ph{color:var(--soft)}
.dd>button.sum .val{min-width:0;overflow-wrap:anywhere}
.dd>button.sum .car{flex:none;width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:5px}
.dd.open>button.sum{border-color:var(--teal-deep);box-shadow:0 0 0 3px rgba(1,193,188,.16)}
.dd.bad>button.sum{border-color:var(--err)}
.dd .menu{position:absolute;z-index:20;top:calc(100% + 6px);left:0;width:max(100%,300px);max-width:min(380px,86vw);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(23,32,58,.18);padding:6px;display:grid;gap:2px;max-height:340px;overflow:auto}
.dd .menu.right{left:auto;right:0}
.dd .menu button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;font-size:.86rem;line-height:1.4;cursor:pointer}
.dd .menu button:hover{background:var(--tint-2)}
.dd .menu .mk{width:18px;height:18px;flex:none;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center}
.dd .menu .mk.r{border-radius:50%}
.dd .menu .mk.c{border-radius:5px}
.dd .menu button[aria-checked=true] .mk{background:var(--teal-deep);border-color:var(--teal-deep)}
.dd .menu button[aria-checked=true] .mk.r::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.dd .menu button[aria-checked=true] .mk.c::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.dd .menu .src{font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold-tint);border-radius:999px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.dd .menu .done{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line-2);margin-top:4px;padding-top:6px;display:flex;justify-content:flex-end}
.dd .menu .done button{background:var(--teal-deep);color:#fff;font-weight:800;padding:7px 14px}
.dd .menu .done button:hover{background:var(--teal-deep);filter:brightness(1.1)}
.ddtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ddtags span{background:var(--tint);color:var(--teal-deep);font-weight:700;font-size:.72rem;border-radius:999px;padding:2px 8px;line-height:1.4}
.owntxt{margin-top:8px}
.owntxt textarea.in{display:block;width:100%;min-height:110px;resize:vertical;padding:10px 12px;font-size:.9rem;line-height:1.5;overflow-wrap:break-word}
.owntxt .cc{text-align:right;font-size:.72rem;color:var(--soft);margin-top:4px;font-variant-numeric:tabular-nums}
.ctog{display:inline-flex;align-items:center;gap:10px;margin-top:12px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;font-size:.82rem;color:var(--ink);cursor:pointer;transition:.15s}
.ctog:hover{border-color:var(--teal)}
.ctog .sw{position:relative;width:36px;height:20px;border-radius:999px;background:#D5DCE3;flex:none;transition:.15s}
.ctog .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.ctog[aria-checked=true]{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
.ctog[aria-checked=true] .sw{background:var(--teal)}
.ctog[aria-checked=true] .sw::after{left:18px}
.offnote{display:block;color:var(--soft);font-size:.84rem;padding-top:10px}
.offcell{vertical-align:middle!important}
.dd{min-width:0}
.na{color:var(--soft);font-size:.8rem;font-style:italic}

/* analysis page */
.an{padding:clamp(20px,3vw,34px)}
.an-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.an-head h2{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(1.3rem,2.2vw,1.7rem)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--bg);border-radius:var(--r-sm);padding:14px 16px}
.stat b{display:block;font-size:1.7rem;line-height:1.1;color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted);font-weight:600}
.an-sec{margin-top:26px}
.an-sec>h3{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:1.05rem}
.an-sec>h3 .ic{color:var(--teal-deep)}
.an-sec>p.lead{margin:0 0 12px;color:var(--muted);font-size:.9rem;max-width:90ch}
.insights{display:grid;gap:10px}
.insight{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:#fff}
.insight .ic{width:24px;height:24px;color:var(--teal-deep);margin-top:1px}
.insight p{margin:0;font-size:.92rem}
.hbars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) 44px;gap:10px;align-items:center;font-size:.86rem}
.hbar .lb{min-width:0;overflow-wrap:anywhere}
.hbar .tr{height:12px;border-radius:6px;background:var(--line-2);overflow:hidden;display:flex}
.hbar .tr i{display:block;height:100%}
.hbar .nm{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.panel2{border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;min-width:0}
.panel2 h4{margin:0 0 12px;font-size:.95rem}
table.dt{width:100%;border-collapse:collapse;font-size:.84rem;min-width:720px}
.dt th{text-align:left;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px;background:var(--tint-2);border-bottom:1px solid var(--line)}
.dt td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.dt td:first-child{font-weight:700;white-space:nowrap}
.delta{display:inline-block;font-size:.72rem;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}
.delta.up{background:var(--ok-bg);color:var(--ok)}
.delta.flat{background:var(--bg);color:var(--muted)}
.kmatrix td,.kmatrix th{text-align:center}
.kmatrix td:first-child,.kmatrix th:first-child{text-align:left}
.kmatrix .tg{font-weight:800;color:var(--teal-deep)}

@media (max-width:1120px){
  .whorow{grid-template-columns:1fr}
  .segpick4{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* table becomes stacked cards */
  table.mt,table.mt tbody,table.mt tr,table.mt td{display:block;width:100%}
  table.mt thead{display:none}
  .mt tr{border-bottom:1px solid var(--line);padding:6px 0}
  .mt tr:last-child{border-bottom:0}
  .mt td{border-bottom:0;padding:8px 14px}
  .mt td[data-l]::before{content:attr(data-l);display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:6px}
  .crit3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mt tr.crit td:first-child{box-shadow:none}
  .mt tr.crit{box-shadow:inset 4px 0 0 var(--teal-deep)}
  .mt tr.nc td[data-l],.mt td.offcell{display:none}
  .dd .menu{width:100%;max-width:none}
}
@media (max-width:520px){.segpick4{grid-template-columns:1fr}}

.shead .n .ic{width:20px;height:20px}
</style>
</head>

async function apiList(round){
  const res = await fetch(`${APPS_SCRIPT_URL}?action=list&round=${encodeURIComponent(round)}`);
  const data = await res.json();
  if (!Array.isArray(data)) throw new Error(data && data.error ? data.error : 'unexpected response');
  return data.sort((a,b)=>a.submittedAt-b.submittedAt);
}
async function apiSubmit(round, name, seg, answers, summary){
  const url = `${APPS_SCRIPT_URL}?action=submit&round=${encodeURIComponent(round)}&name=${encodeURIComponent(name)}&segment=${encodeURIComponent(seg)}&summary=${encodeURIComponent(summary)}&answers=${encodeURIComponent(JSON.stringify(answers))}`;
  const res = await fetch(url); const data = await res.json();
  if (!data || data.ok !== true) throw new Error(data && data.error ? data.error : 'unexpected response');
}

const draftKey = r => 'rakez_ws2v2_' + r;

function rowIssue(id){
  const r = P.mot[id] || {};
  if (r.crit !== 'crit') return '';
  if (!r.target || (r.target === OWN && (r.targetOwn||'').trim().length < 5)) return 'choose the target experience';
  if (!(r.empower||[]).length) return 'choose what the frontline can do';
  if (!(r.recover||[]).length) return 'choose at least one recovery step';
  return '';
}
function problems(){
  const out = [];
  if (P.name.trim().length < 2) out.push({id:'name', msg:'Enter the group leader’s name.'});
  if (!P.seg) out.push({id:'segpick', msg:'Choose your group’s segment.'});
  if (!P.seg) return out;
  if (ROUND === 'mot'){
    const st = stagesFor(P.seg);
    st.forEach(s => { const m = rowIssue(s.id); if (m) out.push({id:'r-'+s.id, msg:`${s.label}: ${m}.`}); });
    if (!st.some(s => (P.mot[s.id]||{}).crit === 'crit')) out.unshift({id:'r-'+st[0].id, msg:'Tick at least one journey as a Moment of Truth.'});
  } else {
    KPI_THEMES.forEach(th => {
      const list = P.ns[th.key];
      if (!list.length) out.push({id:'th-'+th.key, msg:`${th.label}: pick at least one KPI.`});
      else if (list.some(x => !x.target.trim() || (x.custom && !x.name.trim()))) out.push({id:'th-'+th.key, msg:`${th.label}: give every KPI a name and a target.`});
    });
  }
  return out;
}
function statusHint(){
  if (!P.seg) return 'Start with your name and segment';
  const n = problems().length;
  if (ROUND === 'mot'){ const st = stagesFor(P.seg), c = st.filter(s => (P.mot[s.id]||{}).crit === 'crit').length;
    return n ? `${c} of ${st.length} journeys ticked · ${n} item${n===1?'':'s'} left` : `Ready to submit · ${c} Moment${c===1?'':'s'} of Truth`; }
  return n ? `${n} item${n===1?'':'s'} left to complete` : 'Ready to submit';
}
function refreshBar(){
  const first = problems()[0];
  const st = document.getElementById('status'); if (st){ st.textContent = P.touched && first ? first.msg : statusHint(); st.classList.toggle('warn', !!(P.touched && first)); }
  const b = document.querySelector('[data-act=submit]'); if (b) b.setAttribute('aria-disabled', String(!!first || P.sending));
  const nm = document.getElementById('name'); if (nm) nm.classList.toggle('bad', !!(P.touched && P.name.trim().length<2));
}

function buildAnswers(){
  if (ROUND === 'mot'){
    const rows = stagesFor(P.seg).map(s => { const r = P.mot[s.id] || {}, c = r.crit === 'crit'; return {stage:s.id, crit: c ? 'crit' : '', target: !c ? '' : r.target === OWN ? (r.targetOwn||'').trim() : (r.target||''), targetOwn: c && r.target === OWN, empower: c ? (r.empower||[]) : [], recover: c ? (r.recover||[]) : []}; });
    return {rows};
  }
  return {kpis: KPI_THEMES.reduce((o, th) => (o[th.key] = P.ns[th.key].map(x => ({kpi:x.name.trim(), target:x.target.trim(), custom:!!x.custom})), o), {})};

function buildSummary(a){
  if (ROUND === 'mot') return a.rows.filter(r => r.crit==='crit').map(r => `${stageOf(r.stage).label} | Target: ${r.target} | Frontline: ${r.empower.join(', ')} | Recovery: ${r.recover.join(', ')}`).join(' || ');

async function submitP(){
  const probs = problems();
  if (probs.length){ P.touched = true; P.open = ''; keep(rP); const el = document.getElementById(probs[0].id); if (el) el.scrollIntoView({behavior:'smooth', block:'center'}); if (probs[0].id==='name') document.getElementById('name').focus({preventScroll:true}); return; }

  P.sending = true; P.error = ''; P.open = ''; keep(rP);
  const a = buildAnswers();
  try{ await apiSubmit(ROUND, P.name.trim(), P.seg, a, buildSummary(a).slice(0, 1900)); P.sent = true; P.sending = false; saveP(); rP(); window.scrollTo({top:0}); }
  catch(e){ P.sending = false; P.error = 'The response couldn’t be sent (' + e.message + '). Check the connection and press Submit again. Nothing has been lost.'; keep(rP); }
}

/* ============================== ANALYSIS ============================== */
function tally(arr){ return arr.reduce((m,x)=>{ if (x) m[x]=(m[x]||0)+1; return m; }, {}); }
function hbars(entries, color){
  if (!entries.length) return '<p class="empty">Nothing yet.</p>';
  const max = Math.max(...entries.map(e=>e[1]));
  return `<div class="hbars">${entries.map(([k,n]) => `<div class="hbar"><span class="lb">${esc(k)}</span><span class="tr"><i style="width:${(n/max*100).toFixed(1)}%;background:${color||'var(--teal-deep)'}"></i></span><span class="nm">${n}</span></div>`).join('')}</div>`;
}
function stackedBySeg(label, field, opts, latest){
  // For each option: how many critical journeys in each segment use it.
  const segs = SEGMENTS.filter(s => latest[s.key]);
  const rows = opts.map(o => { const per = segs.map(s => critRows(latest[s.key]).filter(r => (r[field]||[]).includes(o)).length); return [o, per, per.reduce((a,b)=>a+b,0)]; }).filter(r => r[2] > 0).sort((a,b)=>b[2]-a[2]);
  if (!rows.length) return '<p class="empty">Nothing yet.</p>';
  const max = Math.max(...rows.map(r=>r[2]));
  return `<div class="hbars">${rows.map(([o, per, tot]) => `<div class="hbar"><span class="lb">${esc(o)}</span><span class="tr">${per.map((n,i)=> n ? `<i title="${esc(segs[i].label)}: ${n}" style="width:${(n/max*100).toFixed(1)}%;background:${segs[i].color}"></i>` : '').join('')}</span><span class="nm">${tot}</span></div>`).join('')}</div>
    <div class="legend">${segs.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>`;
}
function analysisMot(latest){
  const segs = SEGMENTS.filter(s => latest[s.key]);
  const all = segs.flatMap(s => critRows(latest[s.key]).map(r => Object.assign({seg:s.key}, r)));
  const byStage = STAGES.map(st => { const app = segs.filter(s => !st.segs || st.segs.includes(s.key)); const crit = app.filter(s => critRows(latest[s.key]).some(r => r.stage === st.id)); return {st, app, crit}; });
  const shared = byStage.filter(x => x.crit.length >= 2 && x.crit.length === x.app.length);
  const topEmp = Object.entries(tally(all.flatMap(r => r.empower||[]))).sort((a,b)=>b[1]-a[1])[0];
  const topRec = Object.entries(tally(all.flatMap(r => r.recover||[]))).sort((a,b)=>b[1]-a[1])[0];
  const ins = [];
  if (shared.length) ins.push(['fire', `A Moment of Truth for every segment that has it: <b>${shared.map(x=>esc(x.st.label)).join(', ')}</b>. These are the strongest candidates for one RAKEZ-wide standard.`]);
  byStage.filter(x => x.crit.length === 1).forEach(x => ins.push(['bullseye', `<b>${esc(x.st.label)}</b> is a Moment of Truth only for ${esc(segOf(x.crit[0].key).label)}, so it can be handled with a segment-specific design.`]));
  if (topEmp) ins.push(['bolt', `Most requested frontline power: <b>${esc(topEmp[0])}</b> (${topEmp[1]} of ${all.length} Moments of Truth).`]);
  if (topRec) ins.push(['recover', `Most common recovery step: <b>${esc(topRec[0])}</b> (${topRec[1]} of ${all.length} Moments of Truth).`]);
  const owns = all.filter(r => r.targetOwn);
  if (owns.length) ins.push(['thought', `${owns.length} target experience${owns.length===1?' was':'s were'} written by the groups in their own words; see the detail table.`]);
  return `
    <div class="stats"><div class="stat"><b>${segs.length} / 4</b><span>segments submitted</span></div><div class="stat"><b>${all.length}</b><span>Moments of Truth in total</span></div><div class="stat"><b>${shared.length}</b><span>journeys that are a Moment of Truth for every segment</span></div></div>
    <div class="an-sec"><h3>${ic('bullseye')}Key insights</h3><p class="lead">Generated from the latest submission of each segment group.</p><div class="insights">${ins.map(([i,t])=>`<div class="insight">${ic(i)}<p>${t}</p></div>`).join('') || '<p class="empty">Not enough responses yet.</p>'}</div></div>
    <div class="an-sec"><h3>${ic('fire')}Moments of Truth by journey and segment</h3><p class="lead">Onboarding applies to the two agent segments only.</p>${heatTable(latest)}</div>
    <div class="an-sec"><h3>${ic('bolt')}Frontline empowerment</h3><p class="lead">How often each on-the-spot power was chosen across Moments of Truth, split by segment.</p>${stackedBySeg('', 'empower', EMPOWER, latest)}</div>
    <div class="an-sec"><h3>${ic('recover')}Recovery when it goes wrong</h3><p class="lead">How often each recovery step was chosen across Moments of Truth, split by segment.</p>${stackedBySeg('', 'recover', RECOVER, latest)}</div>
    <div class="an-sec"><h3>${ic('check')}Moments of Truth in detail</h3><p class="lead">Every journey ticked as a Moment of Truth, with the actions each group agreed.</p>
      <div class="tscroll"><table class="dt"><thead><tr><th>Segment</th><th>Journey</th><th>Target experience</th><th>Frontline can, on the spot</th><th>If it goes wrong</th></tr></thead><tbody>
      ${all.map(r => `<tr><td><span class="seg" style="--sc:${segOf(r.seg).color}"><span class="segdot"></span>${esc(segOf(r.seg).label)}</span></td><td>${esc(stageOf(r.stage).label)}</td><td>${esc(r.target)}${r.targetOwn?' <span class="muted" style="font-size:.74rem">(own words)</span>':''}</td><td>${esc((r.empower||[]).join('; '))}</td><td>${esc((r.recover||[]).join('; '))}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">No Moments of Truth yet.</td></tr>'}
      </tbody></table></div></div>`;
}
// Parse a figure such as "88%", "≥ 90%", "2.5 days", "≤ 1 day" into {num, unit}.
function parseFig(s){
  const m = String(s||'').replace(/,/g,'').match(/(-?\d+(?:\.\d+)?)\s*(%|days?|hrs?|hours?|mins?|minutes?)?/i); if (!m) return null;
  let u = (m[2]||'').toLowerCase(); u = u.startsWith('day') ? 'days' : u.startsWith('h') ? 'hrs' : u.startsWith('min') ? 'mins' : u;
  return {num:+m[1], unit:u};
}
function deltaChip(kpi, seg, target){
  const b = baselineFor(kpi, seg); if (!b || /overall|onboarding/i.test(b.value) && !/^\d/.test(b.value)) {}
  if (!b) return '';
  const x = parseFig(b.value), y = parseFig(target); if (!x || !y) return '';
  if (x.unit !== y.unit && !(x.unit==='' && y.unit==='')) return '';
  const lowerBetter = ['days','hrs','mins'].includes(x.unit) || /TAT|Handling|Response Time/i.test(kpi);
  const d = +(y.num - x.num).toFixed(2), unit = x.unit === '%' ? ' pts' : (x.unit ? ' ' + x.unit : '');
  if (d === 0) return '<span class="delta flat">Hold today’s level</span>';
  const better = lowerBetter ? d < 0 : d > 0;
  return `<span class="delta ${better?'up':'flat'}">${d>0?'+':''}${d}${unit}${better?'':' (below today)'}</span>`;
}
function analysisNs(latest){
  const segs = SEGMENTS.filter(s => latest[s.key]);
  const picks = segs.flatMap(s => KPI_THEMES.flatMap(th => ((latest[s.key].answers.kpis||{})[th.key]||[]).map(x => Object.assign({seg:s.key, theme:th.key}, x))));
  const freq = Object.entries(tally(picks.map(p => p.kpi))).sort((a,b)=>b[1]-a[1]);
  const common = freq.filter(([,n]) => n === segs.length && segs.length > 1).map(([k])=>k);
  const custom = picks.filter(p => p.custom);
  const kpis = [...new Set(picks.map(p=>p.kpi))].sort((a,b)=> (tally(picks.map(p=>p.kpi))[b]) - (tally(picks.map(p=>p.kpi))[a]));
  const ins = [];
  if (common.length) ins.push(['star', `Chosen by every segment: <b>${common.map(esc).join(', ')}</b>. These can anchor a single RAKEZ-wide North Star.`]);
  KPI_THEMES.forEach(th => { const n = picks.filter(p=>p.theme===th.key).length; ins.push([th.icon, `<b>${esc(th.label)}</b>: ${n} KPI${n===1?'':'s'} chosen across ${segs.length} segment${segs.length===1?'':'s'}.`]); });
  if (custom.length) ins.push(['thought', `${custom.length} KPI${custom.length===1?' was':'s were'} added by the groups: ${custom.map(c=>esc(c.kpi)+' ('+esc(segOf(c.seg).label)+')').join(', ')}.`]);
  return `
    <div class="stats"><div class="stat"><b>${segs.length} / 4</b><span>segments submitted</span></div><div class="stat"><b>${picks.length}</b><span>KPI targets set</span></div><div class="stat"><b>${kpis.length}</b><span>distinct KPIs</span></div></div>
    <div class="an-sec"><h3>${ic('bullseye')}Key insights</h3><p class="lead">Generated from the latest submission of each segment group.</p><div class="insights">${ins.map(([i,t])=>`<div class="insight">${ic(i)}<p>${t}</p></div>`).join('')}</div></div>
    <div class="an-sec"><h3>${ic('star')}KPI and target matrix</h3><p class="lead">Target set by each segment. Where a baseline exists, the change from today is shown; percentages are compared in points.</p>
      <div class="tscroll"><table class="dt kmatrix"><thead><tr><th>KPI</th>${segs.map(s=>`<th><span class="seg" style="--sc:${s.color}">${esc(s.label)}</span></th>`).join('')}</tr></thead><tbody>
      ${kpis.map(k => `<tr><td>${esc(k)}</td>${segs.map(s => { const p = picks.find(x => x.seg===s.key && x.kpi===k); if (!p) return '<td class="muted">–</td>'; const b = baselineFor(k, s.key); return `<td><div class="tg">${esc(p.target)}</div>${b?`<div class="muted" style="font-size:.74rem">Today ${esc(b.value)}</div>`:''}${deltaChip(k, s.key, p.target)}</td>`; }).join('')}</tr>`).join('') || '<tr><td class="empty">No KPIs yet.</td></tr>'}
      </tbody></table></div></div>
    <div class="an-sec"><h3>${ic('commercial')}Most chosen KPIs</h3><p class="lead">Number of segments that chose each KPI.</p>${hbars(freq)}</div>`;
}
async function rA(){
  const R = ROUNDS[ROUND] || ROUNDS.mot, key = R.key;
  document.getElementById('heroTitle').textContent = `Activity ${R.n} analysis · ${R.label}`;
  document.getElementById('heroSub').textContent = 'Consolidated view of every segment group’s latest submission.';
  const app = document.getElementById('app');
  app.innerHTML = '<div class="an"><p class="empty">Loading results…</p></div>';
  await loadData([key]);
  const latest = latestBySeg(D.data[key] || []);
  app.innerHTML = `<div class="an">
    <div class="an-head"><div><div class="k">Activity ${R.n} analysis</div><h2>${esc(R.label)}</h2><p class="muted" style="margin:4px 0 0;font-size:.85rem">${D.updated ? 'Updated ' + D.updated.toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : ''}</p></div>
      <div class="ractions"><a class="btn ghost sm" href="${esc(pageLink({round:key}))}">Back to console</a><button type="button" class="btn primary sm" data-act="arefresh">Refresh</button></div></div>
    ${D.sample ? '<div class="notice" style="margin-bottom:16px">Sample data: the response sheet isn’t connected yet, so this analysis is illustrative only.</div>' : ''}
    ${D.err ? `<div class="err" style="margin-bottom:16px">${esc(D.err)}</div>` : ''}
    ${Object.keys(latest).length ? (key === 'mot' ? analysisMot(latest) : analysisNs(latest)) : '<p class="empty">No responses yet.</p>'}
  </div>`;
}

/* ============================== EVENTS ============================== */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (VIEW === 'submit' && P.open && !e.target.closest('.dd')){ P.open = ''; keep(rP); if (!b) return; }
  if (!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (VIEW === 'analysis'){ if (a==='arefresh') rA(); return; }
  if (VIEW === 'console'){
    if (a==='tab'){ C.round = v; C.confirm = false; rC(); return; }
    if (a==='refresh'){ loadConsole(); return; }
    if (a==='copy'){ const box = document.getElementById('linkBox'); try { await navigator.clipboard.writeText(box.value); b.textContent = 'Copied'; } catch(err){ box.select(); } return; }
    if (a==='csv'){ exportCsv(); return; }
    if (a==='clear'){ C.confirm = true; keep(rC); return; }
    if (a==='clearno'){ C.confirm = false; keep(rC); return; }
    if (a==='clearyes'){ C.confirm = false; try { await apiClear(C.round); } catch(err){} loadConsole(); return; }
    return;
  }
  if (a==='again'){ P.sent = false; saveP(); rP(); return; }
  if (a==='submit'){ submitP(); return; }
  if (a==='seg'){ if (P.seg !== v && ROUND==='northstar') P.ns = {experience:[], commercial:[], operational:[]}; P.seg = v; }
  else if (a==='ddtoggle'){ P.open = P.open === b.dataset.k ? '' : b.dataset.k; keep(rP); return; }
  else if (a==='ddclose'){ P.open = ''; keep(rP); return; }
  else if (a==='ddpick'){
    const [kind, id] = b.dataset.k.split(':'), r = row(id), multi = b.dataset.multi === '1';
    const field = {t:'target', e:'empower', v:'recover'}[kind];
    if (multi){ const cur = r[field] || []; r[field] = cur.includes(v) ? cur.filter(x=>x!==v) : [...cur, v]; }
    else { r[field] = v; P.open = ''; }
    saveP(); keep(rP);
    if (field==='target' && v===OWN){ const t = document.querySelector(`[data-act=own][data-id="${id}"]`); if (t) t.focus({preventScroll:true}); }
    return;
  }
  else if (a==='crit'){ const r = row(b.dataset.id); r.crit = r.crit === 'crit' ? '' : 'crit'; }
  else if (a==='kpi'){ const L = P.ns[b.dataset.th]; const i = L.findIndex(x => !x.custom && x.name === v); if (i >= 0) L.splice(i, 1); else if (L.length < MAX_KPIS) L.push({name:v, target:'', custom:false}); }
  else if (a==='addkpi'){ const L = P.ns[b.dataset.th]; if (L.length < MAX_KPIS) L.push({name:'', target:'', custom:true}); }
  else if (a==='rmkpi'){ P.ns[b.dataset.th].splice(+b.dataset.i, 1); }
  else return;
  saveP(); keep(rP);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && VIEW === 'submit' && P.open){ const k = P.open; P.open = ''; keep(rP); const s = document.querySelector(`[data-dd="${k}"] .sum`); if (s) s.focus(); } });
document.addEventListener('input', e => {
  const t = e.target, a = t.dataset && t.dataset.act; if (!a || VIEW !== 'submit') return;
  if (a==='name') P.name = t.value;
  else if (a==='own'){ row(t.dataset.id).targetOwn = t.value; t.style.height = 'auto'; t.style.height = Math.max(110, t.scrollHeight + 3) + 'px'; const cc = t.parentNode.querySelector('.cc'); if (cc) cc.textContent = t.value.length + ' / 300'; }
  else if (a==='tgt') P.ns[t.dataset.th][+t.dataset.i].target = t.value;
  else if (a==='cname') P.ns[t.dataset.th][+t.dataset.i].name = t.value;
  else return;
  saveP(); refreshBar();
});

/* ============================== BOOT ============================== */
if (VIEW === 'analysis') rA();
else if (VIEW === 'submit' && ROUND) rP();
else if (VIEW === 'submit'){
  document.getElementById('heroTitle').textContent = 'Choose your activity';
  document.getElementById('app').innerHTML = `<div class="psec"><div class="segcols" style="margin-top:0">${Object.values(ROUNDS).map(r=>`<a class="segcol" style="--sc:var(--teal-deep);text-decoration:none;color:inherit" href="${esc(roundLink(r.key))}"><h4>Activity ${r.n}: ${esc(r.label)}</h4><p class="muted" style="margin:0;font-size:.9rem">${esc(r.desc)}</p></a>`).join('')}</div></div>`;
}
else { loadConsole(); setInterval(loadConsole, 20000); }

</script>
